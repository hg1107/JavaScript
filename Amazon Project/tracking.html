<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Tracking - Amazon Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Track your Amazon order package delivery status.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/shared/amazon-header.css">
    <link rel="stylesheet" href="styles/pages/tracking.css">
  </head>
  <body>
    <div class="amazon-header">
      <div class="amazon-header-left-section">
        <a href="amazon.html" class="header-link">
          <img class="amazon-logo" src="images/amazon-logo-white.png" alt="Amazon Logo">
          <img class="amazon-mobile-logo" src="images/amazon-mobile-logo-white.png" alt="Amazon Logo">
        </a>
      </div>

      <div class="amazon-header-middle-section">
        <input class="search-bar js-search-bar" type="text" placeholder="Search products">
        <button class="search-button js-search-button" aria-label="Search">
          <img class="search-icon" src="images/icons/search-icon.png" alt="Search">
        </button>
      </div>

      <div class="amazon-header-right-section">
        <a class="orders-link header-link" href="orders.html">
          <span class="returns-text">Returns</span>
          <span class="orders-text">& Orders</span>
        </a>

        <a class="cart-link header-link" href="checkout.html">
          <img class="cart-icon" src="images/icons/cart-icon.png" alt="Cart">
          <div class="cart-quantity js-cart-quantity">0</div>
          <div class="cart-text">Cart</div>
        </a>
      </div>
    </div>

    <main class="main">
      <div class="order-tracking js-order-tracking">
        <!-- Rendered dynamically by tracking.js -->
      </div>
    </main>

    <script type="module" src="Scripts/tracking.js"></script>
  </body>
</html>
