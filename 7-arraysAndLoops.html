<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays and Loops</title>
</head>
<body>
    <script>
        const myArray = [10, 20, 30];
        console.log(myArray);
        console.log(myArray[1]);    // Indexing

        myArray[3] = "Added";
        console.log(myArray[3]);
        console.log(myArray);

        myArray[4] = { name: "Hardeep", age: 20};
        console.log(myArray);

        // Properties:
        console.log("Properties:")
        console.log(myArray.length);
        myArray.push(100); console.log(myArray);
        myArray.splice(0, 1);   // Remove index (0) for (1) times
        console.log(myArray);

        // Loops:
        console.log("While Loop:");
        let i = 1;
        while (i <= 5) {
            console.log(i)
            i ++;
        }

        console.log("For Loop:")
        for (let i = 5; i <= 10;  i++) {
            console.log(i);
        }

        console.log("Looping through Array:");
        const todoList = [
            'make dinner',
            'wash dishes',
            'watch youtube'
        ];
        
        for (let index = 0; index < todoList.length; index++) {
            console.log(todoList[index]);
        }

        console.log("Accumulator Method:");
        const nums = [1, 1, 3];
        let total = 0;
        for (let i = 0; i < nums.length; i++) {
            total += nums[i];
        }
        console.log(total);

        console.log("Copy of array, with each number doubled:");
        const ogArray = [1, 2, 3, 4, 5];
        let newArray = [];

        for (let i = 0; i < ogArray.length; i++) {
            const doubled = ogArray[i] * 2;
            newArray.push(doubled);
        }
        console.log(newArray);

    </script>
</body>
</html>
