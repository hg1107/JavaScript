<!DOCTYPE html>
<html lang="en">
<head>
    <title>Boolean and IF Statements</title>
</head>
<body>
    <script>
        console.log(typeof true);
        console.log(5 == '5');
        console.log(5 === '5');

        if (true){
            console.log('hi');
        } else{
            console.log('bye');
        }

        if (5 > 1){
            console.log('5 is greater than 1');
        } else if (5 < 1){
            console.log('5 is less than 1');
        } else{
            console.log('5 is equal to 1');
        }
    </script>
</body>
</html>
