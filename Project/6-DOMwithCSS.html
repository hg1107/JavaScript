<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Project</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .subs-button {
            border: none;
            border-radius: 25px;
            background-color: black;;
            color: white;
            padding: 13px;
            width: 120px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 50px;
        }
        .is-subscribed {
            background-color: rgb(240, 240, 240);
            color: black;
        }

        .cost-input {
            padding: 15px;
            font-size: 15px;
        }
        .cost-button {
            font-size: 15px;
            padding: 15px;
            background-color: green;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <p>YouTube Subscribe Button</p>
    <button class = 'js-subscribe subs-button' onclick = "Subscribe()">Subscribe</button>

    <p>Rock Paper Scissors</p>
    <a href="5-DomRPS.html" target="_blank">Click Here!</a>

    <br><br><br>
    <p>Amazon Shipping Cost Calculator</p>
    <p>Orders under $40 = +$10 Shipping</p>
    <p>Orders of $40 or more = Free Shipping</p>
    <input type="text" placeholder="Cost of Order" class="js-cost-of-order cost-input" onkeydown="OnEnter(event)">
    <button class = "cost-button" onclick="CalculateTotal()">Calculate</button>
    <p class = "js-total-cost"></p>
    

    <script>
        const buttonSubs = document.querySelector('.js-subscribe');
        function Subscribe() {
            if (buttonSubs.innerText === 'Subscribe') {
                buttonSubs.innerText = 'Subscribed';
                buttonSubs.classList.add('is-subscribed');
            } else if (buttonSubs.innerText === 'Subscribed') {
                buttonSubs.innerText = 'Subscribe';
                buttonSubs.classList.remove('is-subscribed');
            }
        }

        function CalculateTotal() {
            const CostOfOrder = document.querySelector('.js-cost-of-order');
            let cost = Number(CostOfOrder.value);
            if (cost < 40) {
                cost += 10;
            }
            document.querySelector('.js-total-cost').innerHTML = `Total cost: $${cost}`;
        }
        function OnEnter(event) {
            if (event.key === 'Enter') {
                CalculateTotal();
            }
        }
    </script>
</body>
</html>
