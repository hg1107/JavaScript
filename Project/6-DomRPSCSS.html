<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="Styles/6-RPS.css">
</head>
<body>
    <h1 class = "title">Rock Papers Scissors</h1>
    <button class = "move-button" onclick="{
        playGame('Rock');
    }"><img src="Images/Rock-emoji.png" class="move-icon "></button>

    <button class = "move-button" onclick="{
        playGame('Paper');
    }"><img src="Images/Paper-emoji.png" class="move-icon"></button>

    <button class = "move-button" onclick="{
        playGame('Scissors');
    }"><img src="Images/Scissors-emoji.png" class="move-icon"></button>

    <p class="js-move-result"></p>
    <p class="js-result result"></p>

    <p class="js-score score">Wins: 0, Losses: 0, Ties: 0</p>
    <button class = "reset-score-button" onclick = "resetButton()">Reset Score</button>

    <script>
        const score = JSON.parse(localStorage.getItem('score')) || {wins: 0, losses: 0, ties: 0};
        let result;
        function pickComputerMove(){
            let computerMove;
            const randomNumber = Math.random();
            if (randomNumber >=0 && randomNumber < 1/3){
                computerMove = 'Rock';
            }else if (randomNumber >= 1/3 && randomNumber < 2/3){
                computerMove = 'Paper';
            }else if (randomNumber >= 2/3 && randomNumber < 1){
                computerMove = 'Scissors';
            }
            return computerMove;
        }

        function playGame(playerMove){
            const computerMove = pickComputerMove();

            if (playerMove === 'Scissors'){
                if(computerMove === 'Rock'){
                    result = 'You lose';
                }else if(computerMove === 'Paper'){
                    result = 'You win';
                }else if(computerMove === 'Scissors'){
                    result = 'Tie';
                }

            } else if (playerMove === 'Rock'){
                if(computerMove === 'Rock'){
                    result = 'Tie';
                }else if(computerMove === 'Paper'){
                    result = 'You lose';
                }else if(computerMove === 'Scissors'){
                    result = 'You win';
                }

            } else if (playerMove === 'Paper'){
                if(computerMove === 'Rock'){
                    result = 'You win';
                }else if(computerMove === 'Paper'){
                    result = 'Tie';
                }else if(computerMove === 'Scissors'){
                    result = 'You lose';
                }
            }

            if (result === 'You win'){
                score.wins += 1;
            }else if (result === 'You lose'){
                score.losses += 1;
            }else if (result === 'Tie'){
                score.ties += 1;
            }

            localStorage.setItem('score', JSON.stringify(score));

            document.querySelector('.js-move-result').innerHTML = `You chose <img src = "Images/${playerMove}-emoji.png" class="move-icon"> - Computer chose <img src = "Images/${computerMove}-emoji.png" class="move-icon">`;
            document.querySelector('.js-result').innerHTML = result;

            scoreElement = document.querySelector('.js-score');
            scoreElement.innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;

        }
        function resetButton () {
            score.wins = 0;
            score.losses = 0;
            score.ties = 0;
            localStorage.removeItem('score');
            scoreElement.innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
        }
    </script>
</body>
</html>
