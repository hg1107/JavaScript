<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Project</title>
</head>
<body>
    <p>YouTube Subscribe Button</p>
    <button class = 'js-subscribe' onclick = "Subscribe()">Subscribe</button>

    <br><br><br><br>
    <p>Rock Paper Scissors</p>
    <a href="5-DomRPS.html" target="_blank">Click Here!</a>

    <br><br><br><br>
    <p>Amazon Shipping Cost Calculator</p>
    <p>Orders under $40 = +$10 Shipping</p>
    <p>Orders of $40 or more = Free Shipping</p>
    <input type="text" placeholder="Cost of Order" class="js-cost-of-order"onkeydown="OnEnter(event)">
    <button onclick="CalculateTotal()">Calculate</button>
    <p class = "js-total-cost"></p>
    

    <script>
        const buttonSubs = document.querySelector('.js-subscribe');
        function Subscribe() {
            if (buttonSubs.innerText === 'Subscribe') {
            buttonSubs.innerText = 'Subscribed';
            buttonSubs.style.backgroundColor = 'grey';
            } else if (buttonSubs.innerText === 'Subscribed') {
                buttonSubs.innerText = 'Subscribe';
                buttonSubs.style.backgroundColor = 'lightgrey';
            }
        }

        function CalculateTotal() {
            const CostOfOrder = document.querySelector('.js-cost-of-order');
            let cost = Number(CostOfOrder.value);
            if (cost < 40) {
                cost += 10;
            }
            document.querySelector('.js-total-cost').innerHTML = `Total cost: $${cost}`;
        }
        function OnEnter(event) {
            if (event.key === 'Enter') {
                CalculateTotal();
            }
        }
    </script>
</body>
</html>
