<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Functions</title>
</head>
<body>
    <script>
        function greeting() {
            console.log("Hello");
        }
        greeting();

        const function1 = function () {
            console.log("No name of the function - Anonymous function");
        }
        console.log(function1);
        function1();

        function display (param) {
            console.log(param);
        }
        display(function1);


        setTimeout(function1, 5000);
        console.log("Written after SetTimeout");

    </script>
</body>
</html>
