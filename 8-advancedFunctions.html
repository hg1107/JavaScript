<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Functions</title>
</head>
<body>
    <button class = "js-button">Click</button>
    <script>
        const buttonElement = document.querySelector('.js-button');
        const eventListener = () => {
            console.log("Click");
        };
        buttonElement.addEventListener('click', eventListener);
        buttonElement.removeEventListener('click', eventListener);


        function greeting() {
            console.log("Hello");
        }
        greeting();

        const function1 = function () {
            console.log("No name of the function - Anonymous function");
        }
        console.log(function1);
        function1();

        function display (param) {
            console.log(param);
        }
        display(function1);


        setTimeout(function1, 3000);        // Asynchronous Code
        console.log("Written after SetTimeout");

        // setInterval(function1, 3000);
        // console.log("Next");

        // Looping through array:
        const toDOList = [
            'make dinner',
            'wash dishes',
            'walk the dog',
        ].forEach(function(value, index) {
            console.log(`${index} : ${value}`);
        });

        const arrowFunction = () => {
            console.log("Hello");
        };
        arrowFunction();

        const oneLine = () => console.log("One line Arrow function");
        oneLine();

        const object2 = {
            method() {
                console.log("Shorthand method for storing methods");
            }
        }

        // Filter, Map:
        const num = [1, -3, 5];
        console.log(num.filter((value, index) => {
            return value >= 0
        }));

        console.log([1, 1, 3].map(value => value * 2 ));
    </script>
</body>
</html>
