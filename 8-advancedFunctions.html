<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Functions</title>
</head>
<body>
    <script>
        function greeting() {
            console.log("Hello");
        }
        greeting();

        const function1 = function () {
            console.log("No name of the function - Anonymous function");
        }
        console.log(function1);
        function1();

        function display (param) {
            console.log(param);
        }
        display(function1);


        setTimeout(function1, 3000);        // Asynchronous Code
        console.log("Written after SetTimeout");

        // setInterval(function1, 3000);
        // console.log("Next");

        // Looping through array:
        const toDOList = [
            'make dinner',
            'wash dishes',
            'walk the dog',
        ].forEach(function(value, index) {
            console.log(`${index} : ${value}`);
        });

    </script>
</body>
</html>
